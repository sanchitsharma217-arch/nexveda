<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#030712" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>

  <!-- Geometric Polygon N-Structure -->
  <path d="M 24 74 V 26 L 48 58 L 72 26 V 74" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-Precision Electric Checkmark X Overlay -->
  <path d="M 38 60 L 52 74 L 78 26" stroke="url(#grad3)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow3)"/>

  <!-- Terminal Glow Node -->
  <circle cx="78" cy="26" r="3.5" fill="#00F0FF"/>
</svg>
