<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Container Background -->
  <rect width="100" height="100" rx="22" fill="#030712" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Geometric N-Stem (Left & Center) -->
  <path d="M 28 75 V 25 L 56 68 V 25" stroke="url(#grad1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"/>

  <!-- Asymmetric X Diagonal with Subtle Integrated Checkmark Blade -->
  <path d="M 44 32 L 72 75" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <path d="M 58 54 L 75 32" stroke="url(#grad1)" stroke-width="7" stroke-linecap="round" filter="url(#glow1)"/>
  
  <!-- Subtle Checkmark Accent Tick -->
  <circle cx="75" cy="32" r="3" fill="#00F0FF"/>
</svg>
